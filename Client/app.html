<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangalore Home Price Prediction</title>
    <link rel="stylesheet" href="app.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="app.js" defer></script>
</head>

<body>
    <div class="main-container">
        <h2>Bangalore Home Price Prediction 🏠</h2>

        <div class="form">
            <label for="uiSqft">Area (Square Feet):</label>
            <input type="number" id="uiSqft" name="uiSqft" placeholder="Enter area">

            <label>BHK:</label>
            <div id="uiBHK">
                <label><input type="radio" name="uiBHK" value="1"> 1</label>
                <label><input type="radio" name="uiBHK" value="2"> 2</label>
                <label><input type="radio" name="uiBHK" value="3"> 3</label>
                <label><input type="radio" name="uiBHK" value="4"> 4</label>
                <label><input type="radio" name="uiBHK" value="5"> 5</label>
            </div>

            <label>Bathrooms:</label>
            <div id="uiBathrooms">
                <label><input type="radio" name="uiBathrooms" value="1"> 1</label>
                <label><input type="radio" name="uiBathrooms" value="2"> 2</label>
                <label><input type="radio" name="uiBathrooms" value="3"> 3</label>
                <label><input type="radio" name="uiBathrooms" value="4"> 4</label>
                <label><input type="radio" name="uiBathrooms" value="5"> 5</label>
            </div>

            <label for="uiLocations">Location:</label>
            <select id="uiLocations"></select>

            <button id="estimateButton">Estimate Price</button>

            <div id="uiEstimatedPrice"></div>
        </div>
    </div>
</body>

</html>
